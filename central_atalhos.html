<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Office — Atalhos e Fórmulas</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:22px 14px 45px}
h1{margin:0;font-size:29px}.sub{color:#666;margin:7px 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid #ccd1d7;background:#fff;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.tab.active{background:#202124;color:#fff}
.panel{display:none}.panel.active{display:block}
.controls{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:#f4f6f8;padding:9px 0}
input,select{border:1px solid #ccd1d7;border-radius:10px;background:#fff;padding:12px 14px;font-size:15px}
input{flex:1;min-width:230px}select{min-width:220px}.count{font-size:14px;color:#666;margin:8px 0 12px}
.tablebox{background:#fff;border:1px solid #ddd;border-radius:12px;overflow-x:auto}.tablebox table{min-width:760px}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{background:#eef1f4;font-size:14px}tr:last-child td{border-bottom:0}tr:hover td{background:#fafafa}
kbd{display:inline-block;border:1px solid #bfc3c8;border-bottom-width:2px;border-radius:6px;background:#fff;padding:5px 8px;font:13px Consolas,monospace;white-space:nowrap}
code{display:inline-block;background:#f1f3f4;border:1px solid #ddd;border-radius:6px;padding:5px 7px;font:13px Consolas,monospace;white-space:nowrap}
.tag{display:inline-block;background:#eef1f4;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:bold;color:#555}
.note{margin-top:16px;padding:13px 15px;background:#fff;border:1px solid #ddd;border-radius:12px;color:#555;font-size:14px}
@media(max-width:1000px){
  .wrap{max-width:none;padding:12px 10px 32px;overflow-x:hidden}
  h1{font-size:23px}
  .sub{font-size:13px;line-height:1.35}
  .tabs{gap:6px}
  .tab{padding:9px 11px;font-size:13px}
  .controls{position:static}
  /* No celular, mantém as fórmulas em LISTA/TABELA, sem transformar cada linha em cartão. */
  .tablebox{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
  }
  .tablebox table{
    width:100%;
    min-width:820px;
    border-collapse:collapse;
  }
  .tablebox th,.tablebox td{
    display:table-cell;
    width:auto;
    min-width:0;
    padding:9px 10px;
    font-size:12px;
    line-height:1.3;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .tablebox th{
    position:sticky;
    top:0;
    z-index:2;
    font-size:11px;
    white-space:nowrap;
  }
  .tablebox tr{
    display:table-row;
    margin:0;
    padding:0;
    background:transparent;
    border:0;
    box-shadow:none;
  }
  .tablebox thead{display:table-header-group}
  .tablebox tbody{display:table-row-group}
  .tablebox tr:hover td{background:#fafafa}
  .tablebox td:before{display:none}
  .tablebox td:first-child strong{font-size:13px}
  .tablebox code{white-space:nowrap;font-size:11px;padding:4px 6px}
  .tablebox .tag{white-space:nowrap;font-size:10px;padding:4px 7px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 Central de Atalhos e Fórmulas</h1>
<div class="sub">Windows, Word, Excel (98 atalhos) e Fórmulas do Excel (104 fórmulas) em um único arquivo, com pesquisa e filtros.</div>

<div class="tabs">
<button class="tab active" data-tab="windows">🪟 Windows</button>
<button class="tab" data-tab="word">📝 Word</button>
<button class="tab" data-tab="excel">📊 Excel</button>
<button class="tab" data-tab="formulas">🧮 Fórmulas</button>
</div>

<div id="windows" class="panel active"></div>
<div id="word" class="panel"></div>
<div id="excel" class="panel"></div>
<div id="formulas" class="panel"></div>

<div class="note">💡 No celular, a tabela se transforma automaticamente em cartões. Na aba Fórmulas, os exemplos usam <strong>;</strong>, como é comum no Excel em português.</div>
</div>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makePanel(id,type){
 const p=document.getElementById(id);
 const isFormula=type==='formulas';
 p.innerHTML=`
 <div class="controls">
   <input id="q_${id}" placeholder="${isFormula?'🔎 Pesquisar fórmula, função ou exemplo...':'🔎 Pesquisar atalho ou função...'}">
   <select id="c_${id}"><option value="">Todas as categorias</option></select>
 </div>
 <div class="count" id="n_${id}"></div>
 <div class="tablebox"><table>
 <thead>${isFormula?'<tr><th>Função</th><th>Para que serve</th><th>Exemplo</th><th>Categoria</th><th>Disponível a partir de</th></tr>':'<tr><th>Atalho</th><th>Função</th><th>Categoria</th></tr>'}</thead>
 <tbody id="b_${id}"></tbody></table></div>`;
 const rows=DATA[type];
 [...new Set(rows.map(r=>isFormula ? r[3] : r[2]))].sort().forEach(c=>{
   const o=document.createElement('option');o.value=c;o.textContent=c;document.getElementById('c_'+id).appendChild(o);
 });
 function render(){
   const q=document.getElementById('q_'+id).value.toLowerCase().trim();
   const cat=document.getElementById('c_'+id).value;
   const rows2=rows.filter(r=>(!cat||(isFormula ? r[3] : r[2])===cat)&&(!q||r.slice(0,isFormula?5:3).some(v=>String(v).toLowerCase().includes(q))));
   document.getElementById('n_'+id).textContent=rows2.length+(isFormula?' fórmula':' atalho')+(rows2.length===1?'':'s')+' encontrado'+(rows2.length===1?'':'s');
   document.getElementById('b_'+id).innerHTML=rows2.map(r=>{
     if(isFormula) return `<tr><td data-label="Função"><strong>${esc(r[0])}</strong></td><td data-label="Para que serve">${esc(r[1])}</td><td data-label="Exemplo"><code>${esc(r[2])}</code></td><td data-label="Categoria"><span class="tag">${esc(r[3])}</span></td><td data-label="Disponível a partir de"><span class="tag">${esc(r[4])}</span></td></tr>`;
     const keys=r[0].split(' + ').map(k=>`<kbd>${esc(k)}</kbd>`).join(' + ');
     return `<tr><td data-label="Atalho">${keys}</td><td data-label="Função">${esc(r[1])}</td><td data-label="Categoria"><span class="tag">${esc(r[2])}</span></td></tr>`;
   }).join('');
 }
 document.getElementById('q_'+id).addEventListener('input',render);
 document.getElementById('c_'+id).addEventListener('change',render);
 render();
}
makePanel('windows','windows');makePanel('word','word');makePanel('excel','excel');makePanel('formulas','formulas');

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active');
}));
</script>
</body>
</html>
